spring:
    application:
        name: springedumanager
    thymeleaf:
        cache: false
    datasource:
        url: jdbc:h2:file:./data/springedumanager;AUTO_SERVER=TRUE
        driver-class-name: org.h2.Driver
        username: sa
        password: ""
    h2:
        console:
            enabled: true
            path: /h2-console
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

server:
    port: 8081
    servlet:
        context-path: /springedumanager

logging:
    level:
        cl.miclase.springedumanager: DEBUG
